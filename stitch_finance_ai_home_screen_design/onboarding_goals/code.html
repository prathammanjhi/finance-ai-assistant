<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Finance AI - Onboarding Goals</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&amp;family=Hanken+Grotesk:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#7abcff",
                    "on-surface-variant": "#c1c7d1",
                    "on-primary-fixed": "#001d34",
                    "surface-container-lowest": "#0b0e12",
                    "on-primary-container": "#004b7c",
                    "outline-variant": "#414750",
                    "surface-dim": "#101418",
                    "outline": "#8b919b",
                    "surface-container-low": "#191c20",
                    "surface-bright": "#36393e",
                    "tertiary-fixed": "#ffddaf",
                    "on-background": "#e1e2e8",
                    "surface-tint": "#9bcbff",
                    "on-primary": "#003256",
                    "background": "#101418",
                    "on-error-container": "#ffdad6",
                    "surface-container-highest": "#323539",
                    "on-secondary": "#1a3249",
                    "tertiary": "#ffca7b",
                    "on-tertiary-fixed-variant": "#614000",
                    "primary-fixed": "#d0e4ff",
                    "surface-container-high": "#272a2e",
                    "primary": "#b3d6ff",
                    "on-primary-fixed-variant": "#004a7a",
                    "tertiary-fixed-dim": "#fcbb4f",
                    "on-secondary-fixed-variant": "#324961",
                    "error": "#ffb4ab",
                    "on-tertiary-container": "#634200",
                    "on-secondary-container": "#a3bbd7",
                    "on-error": "#690005",
                    "on-tertiary-fixed": "#281800",
                    "secondary-fixed-dim": "#b1c9e6",
                    "secondary-fixed": "#d0e4ff",
                    "on-secondary-fixed": "#021d33",
                    "tertiary-container": "#ebac42",
                    "surface": "#101418",
                    "secondary": "#b1c9e6",
                    "inverse-primary": "#02629f",
                    "error-container": "#93000a",
                    "primary-fixed-dim": "#9bcbff",
                    "surface-container": "#1d2024",
                    "on-tertiary": "#442c00",
                    "on-surface": "#e1e2e8",
                    "inverse-surface": "#e1e2e8",
                    "surface-variant": "#323539",
                    "inverse-on-surface": "#2e3135",
                    "secondary-container": "#344b63"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "16px",
                    "bento-gap": "12px",
                    "grid-margin": "24px",
                    "section-padding": "40px"
            },
            "fontFamily": {
                    "display-hero": [
                            "Sora"
                    ],
                    "body-md": [
                            "Hanken Grotesk"
                    ],
                    "label-mono": [
                            "JetBrains Mono"
                    ],
                    "headline-lg-mobile": [
                            "Sora"
                    ],
                    "headline-lg": [

                    ]
            },
            "fontSize": {
                    "display-hero": [

        },
      }

<style>
        .ai-orb-glow {
            box-shadow: 0 0 20px rgba(122, 188, 255, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.2);
            animation: pulse-glow 3s infinite alternate;
        }
        @keyframes pulse-glow {
            0% { opacity: 0.8; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }
        .bento-card {
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .input-focus-border:focus-within {
            border-bottom-color: #7abcff;
        }
    </style>
</head>
<body class="bg-[#0B0D12] text-on-surface min-h-screen font-body-md flex flex-col pt-gutter px-gutter pb-section-padding antialiased bg-background">
<!-- Top Navigation & Progress -->
<header class="w-full flex items-center justify-between mb-section-padding">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex-1 px-4 max-w-[120px] ml-auto mr-auto">
<div class="h-1 bg-surface-container-high rounded-full overflow-hidden w-full">
<div class="h-full bg-primary-container w-3/5 rounded-full transition-all duration-500" style="width: 60%;"></div>
</div>
</div>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto relative z-10">
<!-- AI Orb Context -->
<div class="flex flex-col items-center justify-center mb-8">
<div class="w-16 h-16 rounded-full bg-white/5 backdrop-blur-[20px] flex items-center justify-center ai-orb-glow border border-white/10 mb-6">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-center mb-3 text-on-surface">
                Koi financial goal hai jo tu track karna chahta hai?
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[280px]">
                You can always add or edit these later — totally optional right now.
            </p>
</div>
<!-- Goal Entry Card -->
<div class="bg-surface-container-low border border-white/5 rounded-xl p-5 mb-4 flex flex-col gap-5">
<!-- Goal Name -->
<div class="flex flex-col gap-1 border-b border-outline-variant input-focus-border pb-2 transition-colors">
<label class="font-label-mono text-label-mono text-outline uppercase tracking-wider" for="goal-name">Goal Name</label>
<input class="bg-transparent border-none p-0 text-on-surface font-body-md focus:ring-0 w-full outline-none placeholder-on-surface-variant/50" id="goal-name" placeholder="e.g. New Car" type="text" value="Goa Trip">
</div>
<!-- Target Amount -->
<div class="flex flex-col gap-1 border-b border-outline-variant input-focus-border pb-2 transition-colors">
<label class="font-label-mono text-label-mono text-outline uppercase tracking-wider" for="target-amount">Target Amount</label>
<div class="flex items-center">
<span class="text-on-surface mr-1 font-body-md">₹</span>
<input class="bg-transparent border-none p-0 text-on-surface font-body-md focus:ring-0 w-full outline-none placeholder-on-surface-variant/50" id="target-amount" placeholder="0" type="text" value="80,000">
</div>
</div>
<!-- Target Date -->
<div class="flex flex-col gap-1 border-b border-outline-variant input-focus-border pb-2 transition-colors">
<label class="font-label-mono text-label-mono text-outline uppercase tracking-wider" for="target-date">Target Date</label>
<div class="flex justify-between items-center w-full">
<input class="bg-transparent border-none p-0 text-on-surface font-body-md focus:ring-0 w-full outline-none placeholder-on-surface-variant/50" id="target-date" placeholder="MM/YYYY" type="text" value="December 2024">
<span class="material-symbols-outlined text-outline text-[20px]">calendar_today</span>
</div>
</div>
</div>
<!-- Add Another Link -->
<button class="flex items-center gap-2 text-primary text-sm font-medium self-start mb-auto hover:opacity-80 transition-opacity px-2 py-2">
<span class="material-symbols-outlined text-[18px]">add</span>
            Add another goal
        </button>
<!-- Actions -->
<div class="mt-8 flex flex-col gap-4">
<button class="w-full bg-primary text-on-primary-fixed rounded-full py-4 px-6 font-bold text-[16px] active:scale-[0.98] transition-transform shadow-lg shadow-primary/20">
                Continue
            </button>
<button class="w-full text-on-surface-variant text-[14px] py-2 hover:text-on-surface transition-colors font-medium tracking-wide">
                Skip for now
            </button>
</div>
</main>


</body></html>
