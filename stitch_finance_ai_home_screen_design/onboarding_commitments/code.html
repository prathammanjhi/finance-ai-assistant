<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding - Commitments | Finance AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&family=Hanken+Grotesk:wght@400;500&family=JetBrains+Mono:wght@500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&family=JetBrains+Mono:wght@100..900&family=Sora:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-low": "#191c20",
                        "surface-container-high": "#272a2e",
                        "inverse-on-surface": "#2e3135",
                        "tertiary": "#ffca7b",
                        "primary-fixed-dim": "#9bcbff",
                        "on-error-container": "#ffdad6",
                        "tertiary-container": "#ebac42",
                        "on-error": "#690005",
                        "primary-fixed": "#d0e4ff",
                        "tertiary-fixed": "#ffddaf",
                        "on-primary-fixed": "#001d34",
                        "surface-variant": "#323539",
                        "on-secondary-container": "#a3bbd7",
                        "on-tertiary-fixed-variant": "#614000",
                        "surface": "#101418",
                        "inverse-surface": "#e1e2e8",
                        "secondary-container": "#344b63",
                        "on-surface-variant": "#c1c7d1",
                        "surface-container": "#1d2024",
                        "tertiary-fixed-dim": "#fcbb4f",
                        "primary": "#b3d6ff",
                        "on-primary": "#003256",
                        "on-secondary-fixed-variant": "#324961",
                        "outline-variant": "#414750",
                        "outline": "#8b919b",
                        "on-primary-fixed-variant": "#004a7a",
                        "surface-dim": "#101418",
                        "on-tertiary": "#442c00",
                        "error": "#ffb4ab",
                        "on-tertiary-container": "#634200",
                        "surface-container-highest": "#323539",
                        "surface-bright": "#36393e",
                        "secondary-fixed-dim": "#b1c9e6",
                        "surface-container-lowest": "#0b0e12",
                        "on-surface": "#e1e2e8",
                        "on-secondary": "#1a3249",
                        "primary-container": "#7abcff",
                        "on-tertiary-fixed": "#281800",
                        "surface-tint": "#9bcbff",
                        "error-container": "#93000a",
                        "secondary": "#b1c9e6",
                        "on-background": "#e1e2e8",
                        "inverse-primary": "#02629f",
                        "on-secondary-fixed": "#021d33",
                        "on-primary-container": "#004b7c",
                        "background": "#101418",
                        "secondary-fixed": "#d0e4ff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "bento-gap": "12px",
                        "grid-margin": "24px",
                        "section-padding": "40px",
                        "gutter": "16px"
                    },
                    fontFamily: {
                        "headline-lg-mobile": ["Sora"],
                        "body-md": ["Hanken Grotesk"],
                        "headline-lg": ["Sora"],
                        "label-mono": ["JetBrains Mono"],
                        "display-hero": ["Sora"]
                    },
                    fontSize: {
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "24px", letterSpacing: "-0.01em", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.03em", fontWeight: "700" }],
                        "label-mono": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
                        "display-hero": ["80px", { lineHeight: "88px", letterSpacing: "-0.04em", fontWeight: "700" }]
                    }
                }
            }
        };
    </script>
<style>
        .glass-orb {
            background: radial-gradient(circle at 30% 30%, rgba(122, 188, 255, 0.4), rgba(122, 188, 255, 0.1) 40%, transparent 80%);
            box-shadow: 0 0 20px rgba(122, 188, 255, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: pulse-orb 4s ease-in-out infinite alternate;
        }
        @keyframes pulse-orb {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 30px rgba(122, 188, 255, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.15); }
        }
        .bento-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
        }
        /* Hide scrollbar for chips */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0B0D12] text-on-surface min-h-screen flex flex-col font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar (Transactional - Hidden Navigation Elements) -->
<header class="w-full top-0 flex items-center px-grid-margin h-16 bg-[#0B0D12] z-50 sticky">
<button class="text-on-surface hover:text-primary transition-colors flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-white/5">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex-1 flex justify-center px-4">
<div class="w-full max-w-[120px] h-1 bg-white/10 rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[80%] rounded-full"></div>
</div>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-1 flex flex-col px-grid-margin md:px-section-padding max-w-2xl mx-auto w-full pt-8 pb-12">
<!-- AI Orb -->
<div class="flex justify-center mb-8">
<div class="w-16 h-16 rounded-full glass-orb"></div>
</div>
<!-- Typography -->
<div class="text-center mb-10 space-y-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">
                Koi regular payments hain jo tu track karna chahta hai?
            </h1>
<p class="text-on-surface-variant max-w-md mx-auto">
                Rent, EMIs, SIPs, subscriptions — anything that comes out on a schedule. Optional, add these anytime later.
            </p>
</div>
<!-- Commitment Card (Bento Style) -->
<div class="bento-card rounded-xl p-6 mb-6 space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-bento-gap">
<!-- Name Field -->
<div class="space-y-2">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider block">Commitment Name</label>
<input class="w-full bg-transparent border-b border-white/10 text-on-surface focus:border-primary-container focus:ring-0 px-0 py-2 transition-colors" placeholder="e.g. Rent" type="text" value="Rent"/>
</div>
<!-- Amount Field -->
<div class="space-y-2">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider block">Amount</label>
<input class="w-full bg-transparent border-b border-white/10 text-on-surface focus:border-primary-container focus:ring-0 px-0 py-2 transition-colors" placeholder="₹0" type="text" value="₹12,000"/>
</div>
</div>
<!-- Type Selector -->
<div class="space-y-3">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider block">Category</label>
<div class="flex flex-nowrap overflow-x-auto no-scrollbar gap-2 pb-1">
<button class="px-4 py-2 rounded-full border border-white/10 text-on-surface-variant hover:bg-white/5 transition-colors whitespace-nowrap text-sm">EMI</button>
<button class="px-4 py-2 rounded-full bg-primary-container text-[#0B0D12] border border-primary-container font-medium whitespace-nowrap text-sm shadow-[0_0_10px_rgba(122,188,255,0.2)]">Rent</button>
<button class="px-4 py-2 rounded-full border border-white/10 text-on-surface-variant hover:bg-white/5 transition-colors whitespace-nowrap text-sm">SIP</button>
<button class="px-4 py-2 rounded-full border border-white/10 text-on-surface-variant hover:bg-white/5 transition-colors whitespace-nowrap text-sm">Subscription</button>
<button class="px-4 py-2 rounded-full border border-white/10 text-on-surface-variant hover:bg-white/5 transition-colors whitespace-nowrap text-sm">Bill</button>
<button class="px-4 py-2 rounded-full border border-white/10 text-on-surface-variant hover:bg-white/5 transition-colors whitespace-nowrap text-sm">Other</button>
</div>
</div>
<!-- Due Date (Optional) -->
<div class="space-y-2">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider block flex justify-between">
<span>Due Date</span>
<span class="text-white/30 text-[10px]">Optional</span>
</label>
<div class="flex items-center gap-3 border-b border-white/10 pb-2">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-on-surface text-sm" placeholder="e.g. 1st of every month" type="text"/>
</div>
</div>
</div>
<!-- Add Another Link -->
<div class="text-center mb-10">
<button class="text-primary-fixed-dim hover:text-primary-container transition-colors font-medium flex items-center justify-center gap-2 mx-auto">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add</span>
                Add another commitment
            </button>
</div>
<!-- Spacer to push CTAs down if needed, but flex-1 handles content above nicely. Let's group CTAs at the bottom. -->
<div class="mt-auto pt-8 flex flex-col gap-4 w-full max-w-sm mx-auto">
<!-- Primary CTA -->
<button class="w-full py-4 rounded-full bg-primary-container text-[#0B0D12] font-headline-lg-mobile text-headline-lg-mobile hover:opacity-90 transition-opacity active:scale-[0.98] shadow-[0_0_20px_rgba(122,188,255,0.15)] flex justify-center items-center gap-2">
                Continue
                <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<!-- Secondary CTA -->
<button class="w-full py-3 text-on-surface-variant hover:text-on-surface transition-colors">
                Skip for now
            </button>
</div>
</main>
</body></html>
